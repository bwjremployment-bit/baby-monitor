name: build

# Builds both APKs and runs all tests on GitHub's free runners, which have the
# Android SDK + unrestricted internet (the dev sandbox cannot reach dl.google.com,
# so this is where real Android compilation happens). Free for public repos.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-tests:
    name: Shared library unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test shared (protocol / pairing / state machine)
        working-directory: shared
        run: ./gradlew test --console=plain

  signaling-tests:
    name: Signalling server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install + test signalling relay
        working-directory: signaling-server
        run: |
          npm ci || npm install
          npm test

  android-apks:
    name: Build Jiàndié Camera + Yps Viewer APKs
    runs-on: ubuntu-latest
    needs: shared-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default install list includes the removed 'tools' package and fails;
          # install exactly what we need in the next step instead.
          packages: ''
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Assemble debug APKs
        run: ./gradlew :camera:assembleDebug :viewer:assembleDebug --console=plain
      - name: Upload Jiàndié Camera APK
        uses: actions/upload-artifact@v4
        with:
          name: jiandie-camera-debug
          path: camera/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Yps Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: yps-viewer-debug
          path: viewer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
